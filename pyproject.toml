[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-soc-pipeline"
version = "0.1.0"
description = "Reproducible synthetic SOC vulnerability-prioritisation research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Research use; licence pending supervisor/university confirmation"}
authors = [{name = "Ricardo"}]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "simpy>=4.1",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "networkx>=3.2",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
thesis-pipeline = "thesis_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

